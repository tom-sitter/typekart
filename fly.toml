# fly.toml app configuration file generated for typekart-relay on 2026-05-17T13:20:12-02:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'typekart-relay'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[env]
  RUST_LOG = 'info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
