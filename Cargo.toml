[package]
name = "typekart"
version = "0.1.8"
edition = "2024"
description = "A terminal typing racer with kart-style item effects"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-sitter/typekart"
homepage = "https://github.com/tom-sitter/typekart"
keywords = ["typing", "game", "terminal", "tui"]
categories = ["command-line-utilities", "games"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "src/**",
    "words_alpha.txt",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:crossterm", "dep:ratatui", "dep:redis", "dep:tungstenite"]

[[bin]]
name = "typekart"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
crossterm = { version = "0.27", optional = true }
rand = "0.8"
ratatui = { version = "0.26", optional = true }
redis = { version = "1", features = ["tls-rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
typekart-protocol = { version = "0.1.6", path = "crates/typekart-protocol" }

[dev-dependencies]
pretty_assertions = "1"
