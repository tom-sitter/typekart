[package]
name = "typekart"
version = "0.1.2"
edition = "2024"
description = "A terminal typing racer with kart-style item effects"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-sitter/typekart"
homepage = "https://github.com/tom-sitter/typekart"
keywords = ["typing", "game", "terminal", "tui"]
categories = ["command-line-utilities", "games"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "src/**",
    "words_alpha.txt",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
rand = "0.8"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", features = ["native-tls"] }

[dev-dependencies]
pretty_assertions = "1"
