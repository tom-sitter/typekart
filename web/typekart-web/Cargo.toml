[package]
name = "typekart-web"
version = "0.1.6"
edition = "2024"
description = "Browser UI shell for TypeKart"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
rand = "0.8"
serde_json = "1"
typekart = { path = "../..", default-features = false }
typekart-protocol = { version = "0.1.6", path = "../../crates/typekart-protocol" }
wasm-bindgen-futures = "0.4"
